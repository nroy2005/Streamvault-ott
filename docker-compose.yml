# Local dev (backend/frontend run on the host): docker compose up -d mongo
# Full stack in containers:                     docker compose up -d --build  → http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env # JWT secrets, TMDB key; app refuses to start without the secrets
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/streamvault
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
